defaults: kaggle_t4.yaml
reconstruction:
  backend: colmap
  camera_model: OPENCV
  use_depth: false
  scene_root: null
  sparse_dir: sparse/0
  images_dir: images
  image_resolution: 640
  validation_fraction: 0.1
  max_points: 100000
  initial_opacity: 0.1
  initial_scale: null
  status: baseline
training:
  device: cuda:0
  seed: 42
  iterations: 3000
  checkpoint_interval: 500
  render_interval: 500
  validation_views: 4
  mixed_precision: false
  learning_rates:
    means: 0.00016
    scales: 0.005
    rotations: 0.001
    opacities: 0.05
    colors: 0.0025
  loss:
    l1_weight: 0.8
    ssim_weight: 0.2
outputs:
  experiment_name: 001_3dgs
  checkpoints: outputs/checkpoints/001_3dgs
  renders: outputs/renders/001_3dgs
  metrics: outputs/metrics/001_3dgs
